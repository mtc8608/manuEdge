[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "manuedge"
version = "0.1.0"
description = "manuEdge — bedside telemetry edge agent for manuBeat (reads medical devices, buffers locally, dials home)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Manuel Cabeleira" }]
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
# Hardware deps — only installable/needed on the Raspberry Pi.
pi = [
    "spidev>=3.6",
    "RPi.GPIO>=0.7.1",
    "gpiozero>=2.0",
]
dev = [
    "pytest>=8",
]

[project.scripts]
manuedge = "manuedge.main:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
